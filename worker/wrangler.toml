name = "project-memory-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[vars]
# Your Firebase project ID (from the Firebase console) — used to verify ID tokens.
FIREBASE_PROJECT_ID = "REPLACE_WITH_FIREBASE_PROJECT_ID"
# The exact origin your PWA is served from — GitHub Pages project site.
ALLOWED_ORIGIN = "https://REPLACE_WITH_GH_USERNAME.github.io"

# Set the real secret with: wrangler secret put GROQ_API_KEY
